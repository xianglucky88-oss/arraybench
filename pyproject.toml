[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "arraybench"
version = "0.1.0"
description = "Bounded multidimensional chunk storage and normalized time-series arrays"
requires-python = ">=3.11"
dependencies = []
[project.scripts]
arraybench = "arraybench.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
